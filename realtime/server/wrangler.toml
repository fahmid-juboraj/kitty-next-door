name = "kitty-next-door"
main = "src/index.ts"
compatibility_date = "2026-09-01"

# The landing site (/, /visit/) is served as static files from this same
# Worker. Build it first with `npm run build:ext` in the repo root.
# Anything that isn't a file (like /v1/connect/...) goes to the Worker code.
[assets]
directory = "../../dist-site"

[[durable_objects.bindings]]
name = "USERS"
class_name = "UserDO"

[[durable_objects.bindings]]
name = "STATS"
class_name = "StatsDO"

[[durable_objects.bindings]]
name = "PARK"
class_name = "ParkDO"

# The Workers Free plan only offers SQLite-backed Durable Objects.
[[migrations]]
tag = "v1"
new_sqlite_classes = ["UserDO"]

[[migrations]]
tag = "v2"
new_sqlite_classes = ["StatsDO"]

[[migrations]]
tag = "v3"
new_sqlite_classes = ["ParkDO"]

# Workers Logs: see button clicks and errors in the dashboard (free plan: a few days of history).
[observability]
enabled = true

[vars]
# How long a visit lasts before the cat walks home.
STAY_SECONDS = "7200"
# How long a trip to the park lasts.
PARK_STAY_SECONDS = "3600"
# Download badges. Firefox users come live from addons.mozilla.org (by this slug).
# Edge and Chrome have no public API: copy "weekly users" from their dashboards here, then deploy.
AMO_SLUG = "kitty-next-door-live"
EDGE_USERS = "0"
CHROME_USERS = "0"
