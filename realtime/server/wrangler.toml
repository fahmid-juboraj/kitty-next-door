name = "kitty-next-door"
main = "src/index.ts"
compatibility_date = "2026-09-01"

# The landing site (/, /visit/) is served as static files from this same
# Worker. Build it first with `npm run build:ext` in the repo root.
# Anything that isn't a file (like /v1/connect/...) goes to the Worker code.
[assets]
directory = "../../dist-site"

[[durable_objects.bindings]]
name = "USERS"
class_name = "UserDO"

[[durable_objects.bindings]]
name = "STATS"
class_name = "StatsDO"

# The Workers Free plan only offers SQLite-backed Durable Objects.
[[migrations]]
tag = "v1"
new_sqlite_classes = ["UserDO"]

[[migrations]]
tag = "v2"
new_sqlite_classes = ["StatsDO"]

# Workers Logs: see button clicks and errors in the dashboard (free plan: a few days of history).
[observability]
enabled = true

[vars]
# How long a visit lasts before the cat walks home.
STAY_SECONDS = "7200"
